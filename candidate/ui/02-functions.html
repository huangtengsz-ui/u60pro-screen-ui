<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body class="{{THEME}} hub">
  {{STATUSBAR}}
  <div class="hub-head">
    <div class="hub-kicker">日常使用</div>
    <div class="hub-title">常用功能</div>
  </div>
  <div class="hub-pair">
    <a href="act:sub:clients.html" class="hub-feature hub-icon-card">
      <span class="ui-ico ico-clients hub-icon"><i></i><em></em><b></b></span>
      <span class="hub-feature-label">连接设备</span>
      <span class="hub-feature-value">{{CLIENTS}} 台</span>
      <span class="hub-feature-desc">查看当前客户端 ›</span>
    </a>
    <a href="act:func:sim-traffic.html" class="hub-feature hub-icon-card">
      <span class="ui-ico ico-flow hub-icon"><i></i><em></em><b></b></span>
      <span class="hub-feature-label">流量</span>
      <span class="hub-feature-value">{{RXBYTES}}</span>
      <span class="hub-feature-desc">本次下载 · 按卡统计 ›</span>
    </a>
  </div>
  <a href="act:sub:sms.html" class="hub-row hub-row-icon">
    <span class="ui-ico ico-sms"><i></i><em></em><b></b></span>
    <span class="hub-row-title">短信</span><span class="hub-row-right">查看消息 ›</span>
  </a>
  <a href="act:sub:settings.html" class="hub-row hub-advanced hub-row-icon">
    <span class="ui-ico ico-settings"><i></i><em></em><b></b><strong></strong></span>
    <span class="hub-row-title">全部设置</span>
    <span class="hub-row-desc">网络 · 供电 · 屏幕 · 显示 · 高级工具</span>
    <span class="hub-row-go">›</span>
  </a>
  <div class="hub-note">从顶部下滑可快速切换常用功能。</div>
  {{TOAST}}
  {{DOTS}}
</body>
</html>
