<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body class="{{THEME}} readable">
  {{STATUSBAR}}
  <div class="subtop">
    <a href="act:backfunc" class="subback">返回</a>
    <span class="subname"><span class="ui-ico ico-wifi"><i></i><em></em><b></b></span>WiFi</span>
  </div>

  <div class="card">
    <div class="title">WiFi 分享</div>
    <table>
      <tr><td class="kv-l">名称</td><td class="val">{{SSID}}</td></tr>
      <tr><td class="kv-l">密码 <a href="act:revealkey" class="rev">{{KEYBTN}}</a></td><td class="val">{{KEY}}</td></tr>
      <tr><td class="kv-l">加密</td><td class="val">{{ENC}}</td></tr>
    </table>
    <a href="act:wifi" class="row setting-tap">
      <span class="lab">WiFi 总开关<span class="st">{{WIFISTATE}}</span></span>
      <span class="ctrl"><span class="sw {{WIFICLASS}}"><span class="sw-track"></span><span class="kn"></span></span></span>
    </a>
    <a href="act:wifi24" class="row setting-tap">
      <span class="lab">2.4G 频段<span class="st">{{WIFI24STATE}}</span></span>
      <span class="ctrl"><span class="sw {{WIFI24CLASS}}"><span class="sw-track"></span><span class="kn"></span></span></span>
    </a>
    <a href="act:wifi5" class="row setting-tap">
      <span class="lab">5G 频段<span class="st">{{WIFI5STATE}}</span></span>
      <span class="ctrl"><span class="sw {{WIFI5CLASS}}"><span class="sw-track"></span><span class="kn"></span></span></span>
    </a>
    <a href="act:psm" class="row setting-tap">
      <span class="lab">WiFi 节能模式<span class="st">{{PSMSTATE}}</span></span>
      <span class="ctrl"><span class="sw {{PSMCLASS}}"><span class="sw-track"></span><span class="kn"></span></span></span>
    </a>
    <a href="act:nfc" class="row setting-tap">
      <span class="lab">NFC 碰一碰<span class="st">{{NFCSTATE}}</span></span>
      <span class="ctrl"><span class="sw {{NFCCLASS}}"><span class="sw-track"></span><span class="kn"></span></span></span>
    </a>
  </div>

  <div class="card">
    <div class="title">已连接设备 <span class="r muted">{{CLIENTS}} 台</span></div>
    {{CLIENTLIST}}
  </div>

  <div class="card">
    <div class="title">DHCP</div>
    <table>
      <tr><td class="kv-l">网关</td><td class="val">{{DHCP_IP}}</td></tr>
      <tr><td class="kv-l">地址池</td><td class="val">{{DHCP_POOL}}</td></tr>
      <tr><td class="kv-l">租期</td><td class="val">{{DHCP_LEASE}}</td></tr>
    </table>
  </div>

  <div class="pgpad"></div>
</body>
</html>
